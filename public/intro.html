<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rikshaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
html,body{margin:0;height:100%;background:#0B1230;overflow:hidden;font-family:system-ui,sans-serif}
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#0B1230 0%,#1A1F52 55%,#3B3F7C 100%)}
.layer{position:absolute;left:-34%;top:-6%;width:168%;height:112%;will-change:transform} #l5{left:-6%;width:112%}
#moon{position:absolute;left:78%;top:14%;width:7vw;height:7vw;border-radius:50%;background:#F4E3A1;box-shadow:0 0 60px 20px rgba(244,227,161,.18);transition:box-shadow 2s}
#haze{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(76,83,153,.18) 72%,transparent 100%);pointer-events:none}
#glow{position:absolute;inset:0;pointer-events:none;transition:opacity .4s 1s;
 background:radial-gradient(ellipse 70% 32% at 50% 76%,rgba(255,217,102,.16),rgba(255,217,102,.06) 55%,transparent 75%)}
#logo{position:fixed;left:32px;top:28px;filter:drop-shadow(0 0 6px rgba(255,217,102,.7));transition:filter 2s}
#logo rect{transition:fill 2s,stroke 2s;stroke:transparent;stroke-width:.8}
.dark #logo{filter:none;transition:filter .2s 1.3s} .dark #logo rect{animation:lo .9s steps(1) var(--d,0s) forwards;transition:none}
@keyframes lo{0%{fill:#FFD966;stroke:transparent}20%{fill:#05060F;stroke:rgba(158,163,214,.6)}38%{fill:#FFD966;stroke:transparent}55%{fill:#05060F;stroke:rgba(158,163,214,.6)}70%{fill:#FFD966;stroke:transparent}100%{fill:#05060F;stroke:rgba(158,163,214,.6)}}
.w{transition:opacity 1.2s} #beam{transition:opacity .3s}
.dark .w{animation:out .7s steps(1) var(--d,0s) forwards!important}
@keyframes out{0%{opacity:1}18%{opacity:0}32%{opacity:1}48%{opacity:0}62%{opacity:.7}74%{opacity:0}86%{opacity:.4}100%{opacity:0}} .dark #glow{opacity:0} .dark #moon{box-shadow:0 0 60px 20px rgba(244,227,161,.05)}
.fl{animation:fl 3s steps(1) infinite} @keyframes fl{0%,40%,100%{opacity:1}45%,55%{opacity:.15}}
.blink{animation:bl 1.6s ease-in-out infinite} @keyframes bl{50%{opacity:.1}} .dark .blink{animation:none;opacity:0}
#go,#back{position:fixed;left:0;top:0;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:3px solid #FFD966;background:#0B1230;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s;image-rendering:pixelated}
#back svg{transform:scaleX(-1)} #go,#back{transition:opacity .5s,transform .15s} .hid{opacity:0!important;pointer-events:none}
#go:hover,#back:hover{transform:translate(-50%,-50%) scale(1.08)}
.bub{opacity:0;transform:scale(0);transform-box:view-box;transition:none} .bub.on{opacity:1;transform:scale(1);animation:pop .35s steps(3) both}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
#rick rect[fill="#F2C94C"]{transition:fill .6s} .dark #rick rect[fill="#F2C94C"]{fill:#BFE3FF}
@media (prefers-reduced-motion:reduce){.fl,.blink{animation:none}}
#logo,#go{z-index:6}
#logo{transform-origin:0 0;transition:filter 2s,transform 1.3s cubic-bezier(.65,0,.35,1)} .dark #logo{transition:filter .2s 1.3s,transform 1.3s cubic-bezier(.65,0,.35,1)} .walling #logo{transform:scale(.6)}
/* bubble 1 fades as the camera pulls back */
.bub.fade{opacity:0!important;transition:opacity .35s!important}
/* ---------- multi-driver wall, caption, grid meter, news splash ---------- */
.px{--n:4px;background:#FFD966;padding:3px;clip-path:polygon(var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)),0 var(--n),var(--n) var(--n))}
.px>.in{background:#13194A;clip-path:inherit}
.gone{opacity:0!important;pointer-events:none!important;transition:opacity .5s!important}
#wall{position:fixed;inset:0;z-index:1;width:100%;height:100%;opacity:0;pointer-events:none;transition:filter 1.4s ease,transform 1.8s ease}
#wall.on{opacity:1} #wall.dim{filter:brightness(.4) saturate(.75) blur(2px);transform:scale(.97)}
#cap{position:fixed;left:0;top:0;z-index:5;transform-origin:0 0;pointer-events:none;transition:transform 1.2s cubic-bezier(.65,0,.35,1),opacity .5s}
#cap svg{display:block;width:100%;height:100%;overflow:visible}
#cap .tail{transition:opacity .35s} #cap.lift .tail{opacity:0}
#cap svg.pop{animation:cpop .35s steps(3) both} @keyframes cpop{0%{transform:scale(.2)}100%{transform:scale(1)}}
#meter{position:fixed;top:32px;right:32px;z-index:5;opacity:0;transition:opacity .6s,background .2s;font:10px/1 'Press Start 2P',monospace;color:#FFD966;pointer-events:none}
#meter.show{opacity:1} #meter .in{display:flex;align-items:center;gap:12px;padding:12px 14px 11px}
#meter .bar{display:flex;gap:2px} #meter .bar i{width:7px;height:14px;background:#262C66}
#meter .bar i.y{background:#FFD966} #meter .bar i.o{background:#F2994A} #meter .bar i.r{background:#FF5A4A}
#meter .pct{min-width:4.5em;text-align:right}
#meter.over{background:#FF5A4A} #meter.over .lbl,#meter.over .pct{color:#FF5A4A}
#meter.over .bar i{background:#FF5A4A;animation:sblink .24s steps(1) infinite} @keyframes sblink{50%{background:#5A1A2A}}
#meter.down{background:rgba(158,163,214,.55)} #meter.down .lbl,#meter.down .pct{color:#9EA3D6} #meter.down .bar i{background:#161B4A!important;animation:none}
#logo.gone{transition:opacity .6s!important}
#news{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,4.5vh,44px);
 background:radial-gradient(ellipse 80% 70% at 50% 48%,rgba(5,6,15,.2),rgba(5,6,15,.85));overflow:hidden;box-sizing:border-box;padding:2vh 0;font-family:'Press Start 2P',monospace;color:#FFD966;transition:opacity .7s,visibility 0s}
#news.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s,visibility 0s .4s}
#news.shake{animation:shk .28s steps(4)} @keyframes shk{25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-2px,2px)}100%{transform:none}}
#ntitle{opacity:0;transform:scale(0);filter:drop-shadow(7px 8px 0 rgba(0,0,0,.5))}
#ntitle.on{opacity:1;transform:scale(1);animation:tpop .4s steps(4) backwards} @keyframes tpop{0%{transform:scale(.2)}100%{transform:scale(1)}}
#ntitle .in{padding:20px 34px 17px;text-align:center}
#ntitle h1{margin:0;font-weight:400;font-size:clamp(16px,2.5vw,32px);letter-spacing:.04em;line-height:1.25;text-shadow:0 0 14px rgba(255,217,102,.55);white-space:nowrap}
#ntitle h1 .cur{display:inline-block;width:.62em;height:.9em;margin-left:.15em;background:#FFD966;vertical-align:-.08em;animation:cur 1s steps(1) infinite} @keyframes cur{50%{opacity:0}}
#ntitle p{margin:13px 0 0;font-size:clamp(7px,.72vw,10px);letter-spacing:.14em;color:#9EA3D6}
#cards{display:flex;justify-content:center;align-items:center;gap:clamp(14px,2.8vw,44px);width:94vw}
.card{--r:0deg;display:block;flex:0 0 auto;position:relative;width:var(--cw,min(26vw,380px));color:inherit;text-decoration:none;opacity:0;transform:rotate(var(--r));
 filter:drop-shadow(8px 9px 0 rgba(0,0,0,.5));transition:transform .28s cubic-bezier(.2,.8,.3,1)}
.card.c1{--r:-3deg} .card.c2{--r:1.8deg;margin-top:5vh} .card.c3{--r:-1.4deg;margin-top:-2vh}
.card.on{opacity:1;animation:slam .55s cubic-bezier(.2,1.35,.4,1) backwards}
@keyframes slam{0%{opacity:0;transform:translateY(-7vh) scale(1.5) rotate(calc(var(--r) + 8deg))}45%{opacity:1}}
.card.on:hover,.card.on:focus-visible{transform:rotate(0deg) scale(1.22);z-index:3;outline:none}
.card .bar{display:flex;align-items:center;gap:5px;padding:8px 9px 7px;background:#0B1230;font-size:clamp(6px,.6vw,8px);color:#9EA3D6;letter-spacing:.05em}
.card .bar i{width:6px;height:6px;background:#FF5A4A} .card .bar i+i{background:#FFD966} .card .bar i+i+i{background:#2E7D5B}
.card .bar span{margin-left:6px;flex:1} .card .bar em{font-style:normal;color:#FFD966}
.card img{display:block;width:100%;height:auto}
.card .fact{padding:10px 11px 9px;font-size:clamp(6px,.66vw,9px);line-height:1.75;letter-spacing:.03em;color:#9EA3D6}
.card .fact b{font-weight:400;color:#FFD966}
.clip{background:#F3F0E6;color:#151515;padding:7% 7% 8%;font-family:Georgia,'Times New Roman',serif}
.clip .mast{font-size:clamp(13px,1.45vw,21px);font-weight:700;padding-bottom:5%;border-bottom:2px solid #151515}
.clip .kick{margin-top:6%;font:700 clamp(6px,.55vw,8px)/1 system-ui,sans-serif;letter-spacing:.12em;color:#B3261E}
.clip .hl{margin-top:3%;font-size:clamp(13px,1.45vw,21px);font-weight:700;line-height:1.18}
.clip .ph{margin-top:6%;aspect-ratio:16/8.5;background:linear-gradient(#0B1230,#3B3F7C);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5%;box-sizing:border-box}
.clip .ph svg{width:34%;image-rendering:pixelated}
.clip .ln{height:7px;margin-top:5%;background:#CFCABD} .clip .ln+.ln{margin-top:3%;width:86%} .clip .ln+.ln+.ln{width:64%}
#actions{display:flex;justify-content:center;align-items:center;gap:clamp(28px,5vw,72px)}
#replay,#down{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;cursor:pointer;
 font:10px 'Press Start 2P',monospace;color:#FFD966;opacity:0;pointer-events:none;transition:opacity .6s}
#replay.on,#down.on{opacity:1;pointer-events:auto}
#replay .disc,#down .disc{width:52px;height:52px;border-radius:50%;border:3px solid #FFD966;background:#0B1230;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#replay:hover .disc,#down:hover .disc{transform:scale(1.08)} #down:hover .disc svg{animation:nod .5s steps(2) infinite} @keyframes nod{50%{transform:translateY(3px)}} 
#fade{position:fixed;inset:0;z-index:20;background:#03040F;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:1}
@media (max-width:900px){#meter{top:96px;right:50%;transform:translateX(50%)} #cards{flex-wrap:wrap;row-gap:22px} .card{width:min(42vw,300px)} .card.c2,.card.c3{margin-top:0}}
@media (max-height:560px),(max-width:900px){#news{padding:16px 0}}
@media (prefers-reduced-motion:reduce){#news.shake{animation:none} #cap svg.pop,.card.on,#ntitle.on{animation-duration:.01s}}
</style></head><body>

<script>
document.querySelectorAll('#l2 rect[fill="#F2C94C"],#l3 rect[fill="#F7D154"],#l4 rect[fill="#FFD966"]').forEach(r=>{r.classList.add('w');r.style.setProperty('--d',(Math.random()*1.4).toFixed(2)+'s')});
document.querySelectorAll('#logo rect').forEach(r=>r.style.setProperty('--d',(Math.random()*.8).toFixed(2)+'s'));
const layers=[['#l0',.012],['#moon',.02],['#l1',.03],['#l2',.055],['#l3',.085],['#l4',.12],['#l5',.16]];
const els=layers.map(([s,d])=>[document.querySelector(s),d]);
const $=id=>document.getElementById(id);
const scene=$('scene'),rick=$('rick'),beam=$('beam'),go=$('go'),logo=$('logo'),wall=$('wall'),cap=$('cap'),meter=$('meter'),news=$('news');

/* ---- timing knobs ---- */
const START=160,END=1215,DUR=7000;   // rickshaw x at park / at house (l5 units), drive time ms
const B1=.02,B2=.42;                 // drive progress where bubble 1 / bubble 2 pop
const SETTLE=750;                    // ms after bubble 2 pops before the camera pulls back
const ZOOM=3600,KF=.175,GAP=.03,RING=3; // pull-back ms, final camera scale, tile gap (x width), tiles each side of centre (7x7 wall)
const PLUG=250,CLIMB=650,OVER=1200,DARK_HOLD=2700; // plug-in delay, last load climb, overload flashing, dark hold before news
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

let tx=0,ty=0,cx=0,cy=0,p=0,t0=0,bob=0,phase='idle',tSettle=0;
const set=(x,y)=>{tx=x;ty=y};
addEventListener('mousemove',e=>set((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2));
addEventListener('deviceorientation',e=>{if(e.gamma!=null)set(Math.max(-1,Math.min(1,e.gamma/30)),Math.max(-1,Math.min(1,(e.beta-45)/30)))});
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const io3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const hash=n=>{const s=Math.sin(n*12.9898)*43758.5453;return s-Math.floor(s)};

/* ---------- snapshot: rasterise the scene once (lit + dark) so it can be tiled cheaply ---------- */
let S=null,prepping=null;
async function raster(str,w,h){
 const url=URL.createObjectURL(new Blob([str],{type:'image/svg+xml'}));
 try{const img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);return c}
 finally{URL.revokeObjectURL(url)}}
function mips(c){const out=[c];while(out[out.length-1].width>200){const s=out[out.length-1],n=document.createElement('canvas');n.width=Math.ceil(s.width/2);n.height=Math.ceil(s.height/2);
 const x=n.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(s,0,0,n.width,n.height);out.push(n)}return out}
async function buildSnaps(){
 const W=innerWidth,H=innerHeight,R=Math.min(2,devicePixelRatio||1);
 const saved=els.map(([el])=>el.style.transform);els.forEach(([el])=>el.style.transform='none');
 const box=el=>{const r=el.getBoundingClientRect();return[r.left,r.top,r.width,r.height]};
 const B={};['l0','l1','l2','l3','l4','l5'].forEach(id=>B[id]=box($(id)));
 const [mx,my,mw]=box($('moon')),m=$('l5').getScreenCTM();
 els.forEach(([el],i)=>el.style.transform=saved[i]);
 const nest=(id,dark)=>{const src=$(id),c=src.cloneNode(true);
  if(id==='l5'){c.querySelector('#rick').remove();c.querySelectorAll('.bub').forEach(e=>e.remove());if(dark)c.querySelectorAll('.blink').forEach(e=>e.remove())}
  if(dark)c.querySelectorAll('.w').forEach(e=>e.remove());
  const[x,y,w,h]=B[id];
  return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${src.getAttribute('viewBox')}" preserveAspectRatio="${src.getAttribute('preserveAspectRatio')}">${c.innerHTML}</svg>`};
 const mr=mw/2,mcx=mx+mr,mcy=my+mr,RR=mr+80,gcx=W/2,gcy=H*.76,grx=W*.7,gry=H*.32;
 const halo=a=>`<radialGradient id="mh" gradientUnits="userSpaceOnUse" cx="${mcx}" cy="${mcy}" r="${RR}">${[[0,.6],[8,.5],[20,.38],[30,.25],[45,.12],[60,.04],[80,0]].map(([d,o])=>`<stop offset="${(mr+d)/RR}" stop-color="#F4E3A1" stop-opacity="${a*o}"/>`).join('')}</radialGradient>`;   // approximates the CSS box-shadow halo
 const glow=`<radialGradient id="gl" gradientUnits="userSpaceOnUse" cx="${gcx}" cy="${gcy}" r="${grx}" gradientTransform="translate(${gcx} ${gcy}) scale(1 ${gry/grx}) translate(${-gcx} ${-gcy})"><stop offset="0" stop-color="#FFD966" stop-opacity=".16"/><stop offset=".55" stop-color="#FFD966" stop-opacity=".06"/><stop offset=".75" stop-color="#FFD966" stop-opacity="0"/></radialGradient>`;
 const svg=dark=>`<svg xmlns="http://www.w3.org/2000/svg" width="${W*R}" height="${H*R}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1230"/><stop offset=".55" stop-color="#1A1F52"/><stop offset="1" stop-color="#3B3F7C"/></linearGradient><linearGradient id="hz" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" stop-color="#4C5399" stop-opacity="0"/><stop offset=".72" stop-color="#4C5399" stop-opacity=".18"/><stop offset="1" stop-color="#4C5399" stop-opacity="0"/></linearGradient>${halo(dark?.05:.18)}${dark?'':glow}</defs>`+
  `<rect width="${W}" height="${H}" fill="url(#sk)"/>${nest('l0')}<circle cx="${mcx}" cy="${mcy}" r="${RR}" fill="url(#mh)"/><circle cx="${mcx}" cy="${mcy}" r="${mr}" fill="#F4E3A1"/>`+
  `${nest('l1',dark)}${nest('l2',dark)}${dark?'':`<rect width="${W}" height="${H}" fill="url(#gl)"/>`}${nest('l3',dark)}${nest('l4',dark)}<rect width="${W}" height="${H}" fill="url(#hz)"/>${nest('l5',dark)}</svg>`;
 const body=[...rick.querySelectorAll('rect')].map(r=>r.outerHTML).join(''),SS=8,bodyBlue=body.replace(/#F2C94C/gi,'#BFE3FF');
 const [lit,dark,sprite,spriteBlue]=await Promise.all([raster(svg(false),W*R,H*R),raster(svg(true),W*R,H*R),
  raster(`<svg xmlns="http://www.w3.org/2000/svg" width="${72*SS}" height="${54*SS}" viewBox="6 0 72 54" shape-rendering="crispEdges">${body}</svg>`,72*SS,54*SS),
  raster(`<svg xmlns="http://www.w3.org/2000/svg" width="${72*SS}" height="${54*SS}" viewBox="6 0 72 54" shape-rendering="crispEdges">${bodyBlue}</svg>`,72*SS,54*SS)]);
 const g=document.createElement('canvas');g.width=g.height=128;const gx=g.getContext('2d'),rg=gx.createRadialGradient(64,64,0,64,64,64);
 rg.addColorStop(0,'rgba(255,217,102,.55)');rg.addColorStop(.35,'rgba(255,217,102,.2)');rg.addColorStop(1,'rgba(255,217,102,0)');gx.fillStyle=rg;gx.fillRect(0,0,128,128);
 return{W,H,M5:{a:m.a,e:m.e,f:m.f},lit:mips(lit),dark:mips(dark),sprite,spriteBlue,glow:g}}
function prep(){const run=buildSnaps().then(s=>{if(prepping===run)S=s}).catch(e=>{console.warn('snapshot failed, using single-scene fallback',e);if(prepping===run)S=null});prepping=run;return run}

/* ---------- the wall: many copies of the scene drawn on one canvas ---------- */
const wctx=wall.getContext('2d');let DPR=1,tiles=[],T={},fired={};
function sizeWall(){DPR=Math.min(2,devicePixelRatio||1);wall.width=Math.round(innerWidth*DPR);wall.height=Math.round(innerHeight*DPR)}
function makeTiles(now){
 tiles=[];const mainArrive=t0+DUR;
 for(let j=-RING;j<=RING;j++)for(let i=-RING;i<=RING;i++){
  const main=!i&&!j,ring=Math.max(Math.abs(i),Math.abs(j)),dur=main?DUR:DUR*(.82+Math.random()*.36);
  const arrive=main?mainArrive:mainArrive+(Math.random()*2-1.1)*900;
  tiles.push({i,j,main,ring,dur,t0:arrive-dur,plug:arrive+PLUG+(main?0:Math.random()*220),bd:ring*120+(main?0:Math.random()*90),ph:Math.random()*6.283,seed:Math.random()*999})}
 const all=Math.max(...tiles.map(t=>t.plug));
 T={swap:now,meter:now+900,all,over:all+CLIMB,black:all+CLIMB+OVER,news:all+CLIMB+OVER+DARK_HOLD};fired={}}
const camK=now=>{const u=clamp((now-T.swap)/ZOOM);return Math.exp(Math.log(KF)*io3(u))*Math.exp(-.012*Math.max(0,now-T.swap-ZOOM)/1000)};
const FL=[[0,1],[.18,0],[.32,1],[.48,0],[.62,.7],[.74,0],[.86,.4],[1,0]];   // same flicker as the original window keyframes
function litOf(t,now){
 if(now<T.black+t.bd){if(now<T.over)return 1;const s=Math.floor((now-T.over)/85)+t.seed,r=hash(s);return 1-(r>.6?.32*r:0)*clamp((now-T.over)/350)}
 const u=(now-T.black-t.bd)/700;if(u>=1)return 0;let v=1;for(const[k,a]of FL)if(u>=k)v=a;return v}
function pick(arr,need){let m=arr[0];for(const a of arr){if(a.width>=need)m=a;else break}return m}
function frame(c,x,y,w,h,s){c.fillRect(x+s,y,w-2*s,s);c.fillRect(x+s,y+h-s,w-2*s,s);c.fillRect(x,y+s,s,h-2*s);c.fillRect(x+w-s,y+s,s,h-2*s)}
function battery(c,cx,by,u,lvl,a,red,now){
 const bw=Math.max(54*u,20),bh=Math.max(Math.round(bw*.46),9),s=Math.max(1.5,bh*.14),x=cx-bw/2,y=by-bh;
 c.globalAlpha=a;c.fillStyle=red?'#FF5A4A':'#FFD966';c.fillRect(x,y,bw,bh);c.fillRect(x+bw,y+bh*.3,s*1.3,bh*.4);
 c.fillStyle='#0B1230';c.fillRect(x+s,y+s,bw-2*s,bh-2*s);
 const n=5,g=Math.max(1,s*.6),iw=bw-4*s,sw=(iw-g*(n-1))/n,f=Math.ceil(lvl*n);
 for(let k=0;k<f;k++){const last=k===f-1&&lvl<1,blink=red?Math.floor(now/120)%2:last&&Math.floor(now/420)%2;if(blink)continue;
  c.fillStyle=red?'#FF5A4A':'#FFD966';c.fillRect(x+2*s+k*(sw+g),y+2*s,sw,bh-4*s)}c.globalAlpha=1}
function drawDriver(c,t,x,y,k,lit,now){
 const u=S.M5.a*k,ox=x+S.M5.e*k,oy=y+S.M5.f*k,pr=clamp((now-t.t0)/t.dur),moving=pr>0&&pr<1;
 const rx=START+(END-START)*ease(pr),ry=679+(moving&&Math.sin(bob+(t.main?0:t.ph))>0?-3:0),charging=now>=t.plug;
 if(charging&&lit>0){const a=clamp((now-t.plug)/400)*lit*(.7+.3*Math.sin(now/240+t.ph)),gr=170*u;
  c.globalCompositeOperation='lighter';c.globalAlpha=a;c.drawImage(S.glow,ox+(rx+63)*u-gr,oy+(ry+34)*u-gr,gr*2,gr*2);c.globalCompositeOperation='source-over';c.globalAlpha=1}
 if(pr>=1&&lit>0){c.globalAlpha=lit;c.fillStyle='#FFD966';c.fillRect(ox+1336*u,oy+698*u,18*u,16*u);c.fillRect(ox+1396*u,oy+698*u,18*u,16*u);c.globalAlpha=1}
 if(lit>0){c.globalAlpha=.18*lit;c.fillStyle='#FFF4C2';c.beginPath();c.moveTo(ox+(rx+126)*u,oy+(ry+42)*u);c.lineTo(ox+(rx+225)*u,oy+(ry+21)*u);c.lineTo(ox+(rx+225)*u,oy+(ry+69)*u);c.fill();c.globalAlpha=1}
 if(lit<1){c.drawImage(S.spriteBlue,ox+(rx+9)*u,oy+ry*u,108*u,81*u)}
 if(lit>0){c.globalAlpha=lit;c.drawImage(S.sprite,ox+(rx+9)*u,oy+ry*u,108*u,81*u);c.globalAlpha=1}
 if(charging&&lit>0)battery(c,ox+(rx+63)*u,oy+(ry-12)*u,u,.12+.88*clamp((now-t.plug)/5200),clamp((now-t.plug)/200)*lit,now>=T.over,now)}
function renderWall(now){
 if(!S)return;const W=innerWidth,H=innerHeight,k=camK(now),c=wctx,sx=W/S.W;
 c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#03040F';c.fillRect(0,0,W,H);c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
 const PX=W*(1+GAP),PY=H+W*GAP,tw=W*k,th=H*k,need=tw*DPR;
 for(const t of tiles){
  const x=W/2+(t.i*PX-W/2)*k,y=H/2+(t.j*PY-H/2)*k;if(x>W||y>H||x+tw<0||y+th<0)continue;
  const lit=litOf(t,now);
  if(lit<1)c.drawImage(pick(S.dark,need),x,y,tw,th);
  if(lit>0){c.globalAlpha=lit;c.drawImage(pick(S.lit,need),x,y,tw,th);c.globalAlpha=1}
  drawDriver(c,t,x,y,k*sx,lit,now);
  if(t.main){const a=clamp((1-k)/.45);if(a>0){c.globalAlpha=a;c.fillStyle=lit>.5?'#FFD966':'rgba(158,163,214,.6)';frame(c,x-6,y-6,tw+12,th+12,3);c.globalAlpha=1}}}}
const segs=[];for(let i=0;i<20;i++){const s=document.createElement('i');meter.querySelector('.bar').appendChild(s);segs.push(s)}
let lastMeter='';
function updateMeter(now){
 let load,label;
 if(now>=T.black+150){load=0;label='GRID DOWN'}
 else{const n=tiles.filter(t=>now>=t.plug).length;load=.52+.46*n/tiles.length+.06*clamp((now-T.all)/CLIMB);label=now>=T.over?'OVERLOAD':Math.round(load*100)+'%'}
 const on=Math.round(clamp(load)*20),key=on+label;if(key===lastMeter)return;lastMeter=key;
 segs.forEach((s,i)=>s.className=i<on?(i<13?'y':i<17?'o':'r'):'');meter.querySelector('.pct').textContent=label}

/* ---------- speech bubble 2 lifts off the scene and becomes the caption ---------- */
let capS=1;
const pbox=poly=>{const n=poly.getAttribute('points').trim().split(/[\s,]+/).map(Number),xs=n.filter((_,i)=>i%2===0),ys=n.filter((_,i)=>i%2);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,width:Math.max(...xs)-x,height:Math.max(...ys)-y}};
function capPlace(g,w0,h0){   // caption is laid out at its final size so the text ends up crisp
 const bb=pbox(g.querySelector('polygon'));capS=clamp(Math.min(innerWidth*.38,500)/w0,1,2.2);
 cap.innerHTML=`<svg viewBox="${bb.x} ${bb.y} ${bb.width} ${bb.height}">${g.innerHTML}</svg>`;cap.querySelectorAll('rect').forEach(r=>r.classList.add('tail'));
 cap.style.width=w0*capS+'px';cap.style.height=h0*capS+'px';return[(innerWidth-w0*capS)/2,innerHeight-h0*capS-Math.max(24,innerHeight*.05)]}
function liftCaption(){
 const g=$('b2'),r=g.querySelector('polygon').getBoundingClientRect(),[x,y]=capPlace(g,r.width,r.height);
 cap.style.transition='none';cap.style.transform=`translate(${r.left}px,${r.top}px) scale(${1/capS})`;cap.style.opacity=1;cap.getBoundingClientRect();
 cap.style.transition='';cap.classList.add('lift');cap.style.transform=`translate(${x}px,${y}px) scale(1)`}
function captionTo(id){
 const g=$(id),bb=pbox(g.querySelector('polygon')),a=S.M5.a,[x,y]=capPlace(g,bb.width*a,bb.height*a);
 cap.style.transition='none';cap.style.transform=`translate(${x}px,${y}px)`;cap.querySelector('svg').classList.add('pop')}

/* ---------- sequence ---------- */
function start(){if(phase!=='idle')return;phase='drive';t0=performance.now();go.classList.add('hid')}
go.onclick=start;
function startWall(now){
 cx=cy=0;for(const[el]of els)el.style.transform='translate(0px,0px)';
 makeTiles(now);sizeWall();renderWall(now);wall.classList.add('on');liftCaption();scene.style.display='none';document.body.classList.add('walling');phase='wall'}
function blackout(){document.body.classList.add('dark');captionTo('b3');setTimeout(()=>meter.classList.replace('over','down')||meter.classList.add('down'),180)}
let newsDone=false;
function showNews(){
 phase='news';newsDone=false;news.classList.remove('off');fitNews();cap.classList.add('gone');meter.classList.add('gone');logo.classList.add('gone');wall.classList.add('dim');news.classList.remove('off');
 const txt='THIS IS THE RESULT.',out=$('ntype');out.textContent='';
 setTimeout(()=>{$('ntitle').classList.add('on');let i=0;const typ=setInterval(()=>{out.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(typ);slam()}},REDUCED?0:55)},600)}
function fitNews(){   // shrink the cards until title, cards and replay all fit on screen
 const cards=$('cards');let w=Math.min(innerWidth*.26,380);cards.style.setProperty('--cw',w+'px');
 const over=()=>news.scrollHeight>innerHeight+1||cards.getBoundingClientRect().bottom+$('actions').offsetHeight+24>innerHeight;
 for(let i=0;i<40&&over()&&w>120;i++){w*=.94;[...cards.children].forEach(c=>c.style.setProperty('--cw',w+'px'))}}
addEventListener('resize',()=>{if(phase==='news')fitNews()});
function slam(){
 const cards=[...document.querySelectorAll('.card')];
 cards.forEach((c,i)=>setTimeout(()=>{c.classList.add('on');if(!REDUCED){news.classList.remove('shake');void news.offsetWidth;news.classList.add('shake')}},380+i*560));
 setTimeout(()=>{$('replay').classList.add('on');$('down').classList.add('on');newsDone=true},380+cards.length*560+400)}
function restart(){$('fade').classList.add('on');setTimeout(()=>{reset();$('fade').classList.remove('on')},480)}
function reset(){
 phase='idle';p=0;tiles=[];T={};fired={};lastMeter='';newsDone=false;
 document.body.classList.remove('dark','walling');document.querySelectorAll('.bub').forEach(e=>e.classList.remove('on','fade'));
 scene.style.display='';wall.classList.remove('on','dim');cap.className='';cap.removeAttribute('style');cap.innerHTML='';
 meter.className='px';meter.querySelector('.pct').textContent='--';segs.forEach(s=>s.className='');
 news.classList.add('off');news.classList.remove('shake');$('ntitle').classList.remove('on');$('ntype').textContent='';$('replay').classList.remove('on');$('down').classList.remove('on');
 document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));logo.classList.remove('gone');
 beam.style.opacity=.18;go.classList.remove('hid');if(!S||S.W!==innerWidth||S.H!==innerHeight)prep()}
$('replay').onclick=restart;
/* CONTINUE: fade to black, then open the simulation app (index.html sits next to this file in both dev and the built dist/). */
const APP_URL='./index.html';
$('down').onclick=()=>{dispatchEvent(new CustomEvent('rikshaw:continue'));$('fade').classList.add('on');setTimeout(()=>location.href=APP_URL,480)};
/* coming back with the browser Back button can restore this page from cache with the fade still on */
addEventListener('pageshow',e=>{if(e.persisted)$('fade').classList.remove('on')});
addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowRight'].includes(e.code))return;
 if(phase==='idle'){e.preventDefault();start()}else if(phase==='news'&&newsDone){e.preventDefault();restart()}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(phase==='wall'){sizeWall()}else if(phase!=='news')prep()},250)});

function tick(now){
 const settling=phase==='settle';if(settling){tx=ty=0}
 const kf=settling?.14:.06;cx+=(tx-cx)*kf;cy+=(ty-cy)*kf;bob+=.25;
 if(phase!=='wall'&&phase!=='news')for(const[el,d]of els)el.style.transform=`translate(${-cx*d*innerWidth}px,${-cy*d*innerHeight*.5}px)`;
 if(phase==='drive'||phase==='settle'||phase==='live'){
  const u=Math.min(1,(now-t0)/DUR);p=ease(u);
  const y=679+(u<1&&Math.sin(bob)>0?-3:0);rick.setAttribute('transform',`translate(${(START+(END-START)*p).toFixed(1)},${y}) scale(1.5)`);
  if(p>=B1)$('b1').classList.add('on');
  if(phase==='drive'&&p>=B2){$('b2').classList.add('on');$('b1').classList.add('fade');phase='settle';tSettle=now}
  if(phase==='settle'&&now-tSettle>=SETTLE){const ok=S&&S.W===innerWidth&&S.H===innerHeight,late=now-tSettle>SETTLE+1200;
   if(ok||S&&late)startWall(now);else if(late)phase='live'}
  if(phase==='live'&&p>=.9)$('b3').classList.add('on');
  if(phase==='live'&&p>.97&&!fired.live){fired.live=1;document.body.classList.add('dark');beam.style.opacity=0;setTimeout(showNews,DARK_HOLD)}}
 else if(phase==='idle')rick.setAttribute('transform',`translate(${START},679) scale(1.5)`);
 if(phase==='wall'){
  if(now>=T.meter&&!fired.meter){fired.meter=1;meter.classList.add('show')}
  if(now>=T.over&&!fired.over){fired.over=1;meter.classList.add('over')}
  if(now>=T.black&&!fired.black){fired.black=1;blackout()}
  if(now>=T.news&&!fired.news){fired.news=1;renderWall(now);showNews()}
  if(phase==='wall'){renderWall(now);updateMeter(now)}}
 placeGo();requestAnimationFrame(tick)}
function placeGo(){if(phase!=='idle')return;const m=$('l5').getScreenCTM();if(!m)return;
 const pt=new DOMPoint(START+63,679-70).matrixTransform(m);go.style.left=pt.x+'px';go.style.top=pt.y+'px'}
requestAnimationFrame(t=>{setTimeout(prep,80);tick(t)});

</script></body></html>
